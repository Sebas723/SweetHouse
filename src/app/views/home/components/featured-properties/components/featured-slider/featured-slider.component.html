<!-- Slider-->
<div class="relative p-2.5 overflow-hidden">
    <div class="flex gap-7 p-2.5 transform duration-700 ease-in-out" [style.transform]="'translateX(-' + currentSlide * 50 + '%)'">
        @for( slide of slides; track slide.id ) {
            <!-- Card-->
            <div class="relative w-[330px] shadow pb-2 shrink-0 rounded-xl">
                <div class="absolute flex justify-between w-full z-10">
                    <div class="flex justify-between">
                        <span class="text-white text-sm bg-red-400/90 backdrop-blur-[5px] rounded-lg m-2 px-2 py-1">{{ slide.title }}</span>
                    </div>

                </div>

                <div class="absolute flex justify-end w-full z-10">
                    <span class="pi pi-heart text-gray-500 text-2xl bg-white/80 backdrop-blur-[5px] rounded-full m-2 px-3 py-3"></span>
                </div>

                <div class="absolute flex w-full z-10 bottom-40 m-2">
                    <p class="font-bold text-white text-2xl">$ {{ slide.price }}<span class="text-gray-300 text-lg">/mes</span></p>
                </div>
                
                <img [src]="slide.image" alt="" class="object-cover rounded-t-xl">

                <div class="flex flex-col p-2.5 gap-2">
                    <div class="flex items-center gap-1">
                        <i class="pi pi-map-marker text-red-500"></i>
                        <h3 class="text-xl font-bold">{{ slide.ciudad }}, {{ slide.barrio }}</h3>
                    </div>
                    <hr class="text-gray-300">

                    <div class="flex flex-row justify-between gap-10">
                        <div class="flex items-center gap-2">
                            <i class="pi pi-expand"></i>
                            <p>1165 m<sup>2</sup></p>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="pi pi-warehouse"></i>
                            <p>3</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="pi pi-warehouse"></i>
                            <p>3</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="pi pi-warehouse"></i>
                            <p>3</p>
                        </div>
                    </div>

                    <button class="text-white font-semibold w-full p-2 rounded-lg mt-4 cursor-pointer" style="background-color: var(--red-color);">Ver detalles</button>
                </div>
            </div>
        }

        <!-- Card-->
        <div class="relative flex items-center justify-center w-[330px] shadow pb-2 shrink-0 rounded-xl cursor-pointer">
            <div class="flex flex-col items-center text-gray-400">
                <i class="pi pi-arrow-right px-3 py-3 rounded-full bg-gray-100"></i>
                <h3 class="text-xl font-bold">Ver más propiedades</h3>
            </div>
        </div>

    </div>

    @if(currentSlide > 0){
        <button class="absolute top-1/3 left-0 z-10 bg-black/60 text-white rounded-full px-4 py-3 text-2xl cursor-pointer hover:bg-black/80 duration-200" (click)="prev()">
            <i class="pi pi-angle-left"></i>
        </button>
    }
    @if(currentSlide >= 0 && currentSlide < 3) {
        <button class="absolute top-1/3 right-0 z-10 bg-black/60 text-white rounded-full px-4 py-3 text-2xl cursor-pointer hover:bg-black/80 duration-200" (click)="next()">
            <i class="pi pi-angle-right"></i>
        </button>
    }
</div>
