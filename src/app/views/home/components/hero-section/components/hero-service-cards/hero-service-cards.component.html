<div class="box-area w-full h-auto pt-5 fluid-horizontal-padding">
    @for(item of cards; track item.id) {
        <div class="h-[170px] w-full rounded-xl border border-gray-200 flex flex-col justify-center items-center gap-3 cursor-pointer hover:-translate-y-2 duration-300 hover:shadow-lg hover:shadow-blue-100">
            <i [class]="item.icon" class="text-3xl"></i>
            <span class="font-semibold">{{ item.title }}</span>
        </div>
    }
</div>
