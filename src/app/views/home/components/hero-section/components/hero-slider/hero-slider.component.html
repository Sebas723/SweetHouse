<div class="w-full h-185 m-auto relative overflow-hidden">
    <div class="flex h-full duration-1000 ease-in-out" [style.transform]="'translateX(-' + currentSlide * 100 + '%)'">
        @for( slide of slide; track slide.id) {
            <div class="min-w-full h-full">
                <img [src]="slide.image" [alt]="slide.title" class="w-full h-full object-cover">
            </div>
        }
    </div>

    <div class="absolute bottom-[15px] w-full flex justify-center gap-[10px]">
        <span
            *ngFor="let slide of slides; let i = index"
            (click)="goToSlide(i)"
            class="w-3 h-3 bg-white rounded-full cursor-pointer transition-opacity duration-300"
            [ngClass]="currentSlide === i ? 'opacity-100' : 'opacity-50'">
        </span>
    </div>
</div>
